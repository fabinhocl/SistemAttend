<!DOCTYPE html>

<html lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        .form-input:focus {
            border-color: #135bec !important;
            ring-color: #135bec !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Header -->
<header class="sticky top-0 z-10 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<button class="text-slate-600 dark:text-slate-400 p-1">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tight">Cadastro de Aluno</h1>
</div>
<button class="text-primary font-semibold text-sm">Cancelar</button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto pb-24">
<form class="max-w-xl mx-auto p-4 space-y-6">
<!-- Student Basic Info -->
<section class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary">person</span>
<h2 class="text-lg font-bold">Dados do Aluno</h2>
</div>
<div class="space-y-4">
<label class="block">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300 mb-1 block">Nome Completo</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-slate-700 dark:bg-slate-800 placeholder:text-slate-400 h-12" placeholder="Ex: João Silva" type="text"/>
</label>
<label class="block">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300 mb-1 block">Nome do Responsável (Opcional)</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-slate-700 dark:bg-slate-800 placeholder:text-slate-400 h-12" placeholder="Ex: Maria Silva" type="text"/>
</label>
</div>
</section>
<!-- Contact Info -->
<section class="space-y-4 pt-2">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary">contact_phone</span>
<h2 class="text-lg font-bold">Informações de Contato</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<label class="block">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300 mb-1 block">Telefone / WhatsApp</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-slate-700 dark:bg-slate-800 placeholder:text-slate-400 h-12" placeholder="(00) 00000-0000" type="tel"/>
</label>
<label class="block">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300 mb-1 block">E-mail</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-slate-700 dark:bg-slate-800 placeholder:text-slate-400 h-12" placeholder="email@exemplo.com" type="email"/>
</label>
</div>
</section>
<!-- Payment & Notes -->
<section class="space-y-4 pt-2">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary">payments</span>
<h2 class="text-lg font-bold">Pagamento e Observações</h2>
</div>
<div class="space-y-4">
<div class="grid grid-cols-2 gap-4">
<label class="block">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300 mb-1 block">Valor por Aula</span>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">R$</span>
<input class="form-input w-full pl-10 rounded-lg border-slate-300 dark:border-slate-700 dark:bg-slate-800 placeholder:text-slate-400 h-12" placeholder="0,00" type="number"/>
</div>
</label>
<label class="block">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300 mb-1 block">Dia de Vencimento</span>
<select class="form-input w-full rounded-lg border-slate-300 dark:border-slate-700 dark:bg-slate-800 h-12">
<option>Dia 05</option>
<option>Dia 10</option>
<option>Dia 15</option>
<option>Dia 20</option>
<option>Dia 25</option>
</select>
</label>
</div>
<label class="block">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300 mb-1 block">Observações (Dificuldades, metas, etc)</span>
<textarea class="form-input w-full rounded-lg border-slate-300 dark:border-slate-700 dark:bg-slate-800 placeholder:text-slate-400 min-h-[100px] p-3" placeholder="Digite aqui informações relevantes sobre o aluno..."></textarea>
</label>
</div>
</section>
<!-- Save Button -->
<div class="pt-4">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined">save</span>
                    Salvar Aluno
                </button>
</div>
</form>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 pb-safe-area">
<div class="flex justify-around items-center px-4 py-3 max-w-xl mx-auto">
<a class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Início</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1">group</span>
<span class="text-[10px] font-medium">Alunos</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">calendar_today</span>
<span class="text-[10px] font-medium">Agenda</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium">Perfil</span>
</a>
</div>
</nav>
</body></html>
