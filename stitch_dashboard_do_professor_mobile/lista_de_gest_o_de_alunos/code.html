<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }

<style>
        body { font-family: 'Lexend', sans-serif; }
        .material-symbols-outlined {

        }
        .active-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {

</div>
</div>
</div>
<button class="bg-slate-50 dark:bg-slate-800 hover:bg-primary/10 hover:text-primary transition-colors px-3 py-2 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1">
                    Ver Contrato
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
</button>
</div>
</div>
</main>
<!-- Floating Action Button -->
<button class="fixed right-6 bottom-24 bg-primary text-white w-16 h-16 rounded-full shadow-lg shadow-primary/40 flex items-center justify-center group active:scale-95 transition-transform z-20">
<span class="material-symbols-outlined text-3xl font-bold">add</span>

<span class="absolute right-20 bg-slate-800 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Cadastrar Aluno</span>
